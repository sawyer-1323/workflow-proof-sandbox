# Unprivileged CI.
# Runs PR-controlled code (this file, scripts, build and tests) with a read-only
# GITHUB_TOKEN. No environment, no secrets, no minted token, no cache, no artifact
# that a privileged workflow reads.
# Action pins: full commit SHAs, verified 2026-11-06; check-pin-age.sh re-checks them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, before any step writes to the runner: the tests create synthetic
      # credential-shaped fixtures in /tmp, and nothing in a temporary directory is
      # ever exempt (credential-audit.sh, pinned fixtures).
      - name: Credential audit, names only (W9, P1)
        run: bash scripts/probes/credential-audit.sh ci

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # pinned to an exact version after T4
          package-manager-cache: false # P6, W8: no cache is saved or restored

      - name: Unit, golden and validator tests
        run: npm test

  key-references:
    # S4 (a) as an early signal. Authoritative evidence is the same script run
    # from main in probe-publish (mode=probe-requests), since a PR can edit this file.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Key secrets appear only where they belong
        run: node scripts/check-key-references.js .github/workflows

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt (official release file), read 2026-11-06.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.31.1"
      # zizmor publishes no checksum file; this is the release asset digest that
      # GitHub reports for zizmor-x86_64-unknown-linux-gnu.tar.gz, read 2026-11-06.
      ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        # UNVERIFIED: flag names for this version and the archive layout.
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zizmor" && tar -xzf "$archive" -C "$RUNNER_TEMP/zizmor"
          "$(find "$RUNNER_TEMP/zizmor" -type f -name zizmor | head -n1)" --offline .github/workflows
